<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>עיתון ברשת · חדשות בזמן אמת</title>

  <style>
    :root {
      --gold: #b8860b;
      --gold-light: #d4a017;
      --bg: #ffffff;
      --bg2: #f5f5f5;
      --bg3: #ebebeb;
      --border: #d0d0d0;
      --border-accent: #b0b0c0;
      --text: #1a1a1a;
      --text-muted: #555;
      --text-dim: #888;
      --red: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: Arial, 'Arial Hebrew', sans-serif;
      font-size: 20px;
      min-height: 100vh; overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: #ffffff;
      border-bottom: 2px solid var(--gold);
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 24px; border-bottom: 1px solid var(--border);
      font-size: 14px; color: var(--text-dim); letter-spacing: 0.1em;
    }
    .live-dot {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--gold); font-weight: 700; letter-spacing: 0.15em;
    }
    .live-dot::before {
      content: ''; width: 7px; height: 7px; background: var(--gold);
      border-radius: 50%; animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)}
    }

    /* ── REFRESH BUTTON ── */
    #refresh-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: 1px solid var(--gold);
      color: var(--gold); cursor: pointer;
      font-size: 13px; padding: 3px 10px; border-radius: 2px;
      font-family: Arial, sans-serif; letter-spacing: .08em;
      transition: all .18s;
    }
    #refresh-btn:hover { background: var(--gold); color: #fff; }
    #refresh-btn:disabled { opacity: .45; cursor: default; }
    #refresh-btn .spin { display: inline-block; animation: spin .7s linear infinite; }

    /* ── COUNTDOWN ── */
    #countdown-bar {
      height: 2px; background: var(--bg3); overflow: hidden;
    }
    #countdown-fill {
      height: 100%; background: var(--gold);
      transition: width 1s linear;
    }

    /* ── TABS ── */
    .tabs-row {
      display:flex; overflow-x:auto; border-top:1px solid var(--border);
      scrollbar-width:none;
    }
    .tabs-row::-webkit-scrollbar{display:none}
    .tab-btn {
      padding:9px 18px; background:none; border:none;
      border-bottom:2px solid transparent; color:var(--text-muted);
      cursor:pointer; font-size:16px; font-family:Arial, sans-serif;
      letter-spacing:.05em; white-space:nowrap; transition:all .2s;
    }
    .tab-btn:hover{color:var(--text)}
    .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

    /* ── MAIN ── */
    main{max-width:1200px;margin:0 auto;padding:28px 20px;position:relative;z-index:1}

    .section-label{
      font-size:14px;color:var(--text-dim);letter-spacing:.2em;
      text-transform:uppercase;margin-bottom:12px;
    }
    .sources-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
    .src-btn {
      padding:9px 16px;background:var(--bg2);border:1px solid var(--border);
      color:var(--text-muted);cursor:pointer;font-size:16px;
      font-family:Arial, sans-serif;border-radius:2px;transition:all .18s;
    }
    .src-btn:hover{border-color:var(--gold);color:var(--text)}
    .src-btn.active{background:var(--gold);border-color:var(--gold);color:#ffffff;font-weight:700}

    /* ── ARTICLES ── */
    .articles-header{
      display:flex;justify-content:space-between;align-items:center;
      border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:20px;
    }
    .articles-header span{font-size:15px;color:var(--text-dim);letter-spacing:.1em}
    .articles-header .updated{color:var(--gold)}

    .featured{
      display:block;text-decoration:none;background:var(--bg2);
      border:1px solid var(--border-accent);border-top:3px solid var(--gold);
      padding:28px;margin-bottom:24px;transition:background .2s;
      animation:fadeUp .4s ease both;
    }
    .featured:hover{background:var(--bg3)}
    .featured .meta{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    .badge-main{
      background:var(--gold);color:#ffffff;
      font-size:13px;font-weight:700;padding:3px 8px;letter-spacing:.1em;
    }
    .featured h2{
      font-family:Arial, sans-serif;
      font-size:clamp(28px,4vw,42px);font-weight:900;
      color:var(--text);margin-bottom:12px;line-height:1.3;
    }
    .featured .src-line{font-size:14px;color:#777;margin-top:12px}

    .cards-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;
    }
    .card{
      display:block;text-decoration:none;background:var(--bg2);
      border:1px solid var(--border);border-right:3px solid var(--border-accent);
      padding:20px;transition:all .18s;animation:fadeUp .4s ease both;
    }
    .card:hover{background:var(--bg3);border-right-color:var(--gold)}
    .card .card-meta{display:flex;justify-content:space-between;margin-bottom:10px}
    .src-tag-small{
      font-size:13px;color:var(--gold);background:rgba(184,134,11,.1);
      padding:2px 7px;letter-spacing:.08em;font-weight:600;
    }
    .time-tag{font-size:13px;color:var(--text-dim)}
    .card h3{
      font-family:Arial, sans-serif;font-size:28px;font-weight:900;
      color:#000;line-height:1.4;text-shadow:0 0 0.3px #000;
    }
    .card .card-src{font-size:14px;color:var(--text-dim);margin-top:10px}

    /* ── STATES ── */
    .state-box{text-align:center;padding:80px 20px}
    .state-box .icon{font-size:56px;opacity:.3;margin-bottom:20px}
    .state-box .title{font-size:20px;color:var(--text-muted);margin-bottom:8px}
    .state-box .sub{font-size:16px;color:var(--text-dim)}
    .loading-spinner{
      display:inline-block;width:36px;height:36px;
      border:2px solid var(--border-accent);border-top-color:var(--gold);
      border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-box{
      background:#fff5f5;border:1px solid #e0b0b0;border-right:3px solid var(--red);
      padding:16px 20px;color:#a03030;font-size:16px;margin-bottom:24px;line-height:1.7;
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px)}
      to{opacity:1;transform:translateY(0)}
    }
    .card:nth-child(2){animation-delay:.05s}
    .card:nth-child(3){animation-delay:.10s}
    .card:nth-child(4){animation-delay:.15s}
    .card:nth-child(5){animation-delay:.20s}
    .card:nth-child(6){animation-delay:.25s}

    /* ── BACKGROUND REFRESH NOTICE ── */
    .bg-refresh-notice {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--gold); opacity: 0;
      transition: opacity .4s;
    }
    .bg-refresh-notice.visible { opacity: 1; }

    footer{
      border-top:1px solid var(--border);padding:20px;text-align:center;
      font-size:14px;color:var(--text-dim);letter-spacing:.12em;
      margin-top:48px;position:relative;z-index:1;
    }
    @media(max-width:600px){
      .topbar{font-size:12px;padding:6px 12px}
      main{padding:20px 12px}
    }
  </style>
</head>
<body>

<header>
  <div class="topbar">
    <span id="clock">--:--:--</span>
    <span class="live-dot">LIVE NEWS</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="bg-refresh-notice" id="bg-notice">↻ מתעדכן...</span>
      <button id="refresh-btn" disabled title="רענן כתבות">↻ רענן</button>
      <span id="datestr">--</span>
    </div>
  </div>
  <div id="countdown-bar"><div id="countdown-fill" style="width:100%"></div></div>
</header>

<main>
  <div class="section-label">▼ בחר נושא / ערוץ</div>
  <div class="sources-grid" id="sources"></div>
  <div id="content">
    <div class="state-box">
      <div class="icon">📰</div>
      <div class="title">בחר נושא או ערוץ כדי להתחיל</div>
    </div>
  </div>
</main>

<footer>עיתון ברשת &middot; Google News RSS &middot; 2026</footer>

<script>
// Multiple CORS proxies — tried in order until one succeeds
const PROXIES = [
  { url: 'https://api.allorigins.win/get?url=',      parse: async r => { const d = await r.json(); return d.contents; } },
  { url: 'https://corsproxy.io/?',                   parse: async r => r.text() },
  { url: 'https://api.codetabs.com/v1/proxy?quest=', parse: async r => r.text() },
];

async function fetchWithFallback(targetUrl) {
  let lastErr;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy.url + encodeURIComponent(targetUrl),
        { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('status ' + res.status);
      const text = await proxy.parse(res);
      if (!text) throw new Error('empty');
      return text;
    } catch(e) { lastErr = e; }
  }
  throw new Error('כל הפרוקסי נכשלו – ' + lastErr?.message);
}

const SOURCES = {
  he: [
    { id:'top-il',    name:'🔥 ראשי',       q:'חדשות' },
    { id:'politics',  name:'🏛️ פוליטיקה',   q:'פוליטיקה ישראל' },
    { id:'security',  name:'🛡️ ביטחון',      q:'ביטחון צבא ישראל' },
    { id:'economy',   name:'📈 כלכלה',       q:'כלכלה שוק הון ישראל' },
    { id:'tech',      name:'💻 טכנולוגיה',   q:'טכנולוגיה הייטק' },
    { id:'sports',    name:'⚽ ספורט',       q:'ספורט ישראל' },
    { id:'health',    name:'🏥 בריאות',       q:'בריאות רפואה' },
    { id:'world',     name:'🌍 בינלאומי',    q:'חדשות עולם' },
    { id:'ynet',      name:'ynet',           q:'site:ynet.co.il' },
    { id:'walla',     name:'וואלה',          q:'site:news.walla.co.il' },
    { id:'maariv',    name:'מעריב',          q:'site:maariv.co.il' },
    { id:'haaretz',   name:'הארץ',           q:'site:haaretz.co.il' },
    { id:'calcalist', name:'כלכליסט',        q:'site:calcalist.co.il' },
    { id:'sport5',    name:'ספורט 5',        q:'site:sport5.co.il' },
  ],
};

const LANG_PARAMS = {
  he: { hl:'iw', gl:'IL', ceid:'IL:iw' },
};

const CACHE_TTL = 3 * 60 * 1000; // 3 minutes in ms
const AUTO_REFRESH_SEC = 180;     // countdown seconds

let activeSource  = null;
let cache         = {};           // { key: { articles, ts } }
let refreshTimer  = null;
let countdownInt  = null;
let countdownSec  = 0;

// ── Clock ──────────────────────────────────────────────────────────────────
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('datestr').textContent =
    now.toLocaleDateString('he-IL',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
tick(); setInterval(tick, 1000);

// ── Source buttons ─────────────────────────────────────────────────────────
function buildSourceButtons() {
  const grid = document.getElementById('sources');
  grid.innerHTML = '';
  SOURCES.he.forEach(src => {
    const btn = document.createElement('button');
    btn.className = 'src-btn' + (activeSource?.id === src.id ? ' active' : '');
    btn.dataset.id = src.id;
    btn.textContent = src.name;
    btn.addEventListener('click', () => fetchFeed(src, false));
    grid.appendChild(btn);
  });
}
buildSourceButtons();

// ── Auto-load "security" on startup ───────────────────────────────────────
const defaultSrc = SOURCES.he.find(s => s.id === 'security');
if (defaultSrc) fetchFeed(defaultSrc, false);

// ── Refresh button ─────────────────────────────────────────────────────────
document.getElementById('refresh-btn').addEventListener('click', () => {
  if (activeSource) fetchFeed(activeSource, true); // force = true
});

// ── Countdown bar ──────────────────────────────────────────────────────────
function startCountdown() {
  clearInterval(countdownInt);
  countdownSec = AUTO_REFRESH_SEC;
  updateCountdownBar();
  countdownInt = setInterval(() => {
    countdownSec--;
    updateCountdownBar();
    if (countdownSec <= 0) {
      clearInterval(countdownInt);
      if (activeSource) autoRefresh();
    }
  }, 1000);
}

function updateCountdownBar() {
  const pct = (countdownSec / AUTO_REFRESH_SEC) * 100;
  document.getElementById('countdown-fill').style.width = pct + '%';
}

// ── Auto-refresh (background, no loading flash) ────────────────────────────
async function autoRefresh() {
  if (!activeSource) return;
  const notice = document.getElementById('bg-notice');
  notice.classList.add('visible');
  await fetchFeed(activeSource, true, true); // force + silent
  notice.classList.remove('visible');
  startCountdown();
}

// ── RSS URL ────────────────────────────────────────────────────────────────
function buildRssUrl(src) {
  const p = LANG_PARAMS.he;
  const q = encodeURIComponent(src.q);
  return `https://news.google.com/rss/search?q=${q}&hl=${p.hl}&gl=${p.gl}&ceid=${p.ceid}&num=20`;
}

// ── Fetch ──────────────────────────────────────────────────────────────────
// force=true  → bypass cache
// silent=true → don't show loading spinner (background refresh)
async function fetchFeed(src, force = false, silent = false) {
  // Update active button
  document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.src-btn[data-id="${src.id}"]`);
  if (btn) btn.classList.add('active');
  activeSource = src;

  // Enable refresh button
  document.getElementById('refresh-btn').disabled = false;

  // Cache hit?
  const ck = 'he_' + src.id;
  const hit = cache[ck];
  if (!force && hit && (Date.now() - hit.ts) < CACHE_TTL) {
    render(hit.articles);
    return;
  }

  if (!silent) showLoading();
  setRefreshBtnLoading(true);

  try {
    const rssUrl = buildRssUrl(src);
    const xmlText = await fetchWithFallback(rssUrl);
    const xml   = new DOMParser().parseFromString(xmlText, 'text/xml');
    const items = [...xml.querySelectorAll('item')];

    if (!items.length) throw new Error('לא נמצאו כתבות. נסה נושא אחר.');

    const articles = items.slice(0, 12).map(item => {
      const title   = item.querySelector('title')?.textContent || '';
      const link    = item.querySelector('link')?.textContent || '#';
      const pubDate = item.querySelector('pubDate')?.textContent || '';
      const srcName = item.querySelector('source')?.textContent || src.name;
      const titleClean = title.replace(/\s-\s[^-]+$/, '').trim();
      return { title: titleClean, url: link, time: relativeTime(pubDate), source: srcName };
    });

    cache[ck] = { articles, ts: Date.now() };
    render(articles);

    // Restart countdown after every successful fetch
    startCountdown();
  } catch(e) {
    showError(e.message);
  } finally {
    setRefreshBtnLoading(false);
  }
}

function setRefreshBtnLoading(on) {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spin">↻</span> טוען...' : '↻ רענן';
}

// ── Time helper ────────────────────────────────────────────────────────────
function relativeTime(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1)  return 'עכשיו';
  if (m < 60) return `לפני ${m} דקות`;
  const h = Math.floor(m / 60);
  if (h < 24) return `לפני ${h} שעות`;
  return `לפני ${Math.floor(h/24)} ימים`;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(articles) {
  const now = new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  let html = `
    <div class="articles-header">
      <span>${articles.length} כתבות</span>
      <span class="updated">עודכן: ${now}</span>
    </div>`;

  const f = articles[0];
  html += `
    <a class="featured" href="${x(f.url)}" target="_blank" rel="noopener noreferrer">
      <div class="meta">
        <span class="badge-main">● ראשי</span>
        <span style="font-size:11px;color:var(--text-muted)">${x(f.source)}</span>
        <span style="font-size:11px;color:var(--text-dim)">${x(f.time)}</span>
      </div>
      <h2>${x(f.title)}</h2>
    </a>`;

  html += '<div class="cards-grid">';
  articles.slice(1).forEach(a => {
    html += `
      <a class="card" href="${x(a.url)}" target="_blank" rel="noopener noreferrer">
        <div class="card-meta">
          <span class="src-tag-small">${x(a.source)}</span>
          <span class="time-tag">${x(a.time)}</span>
        </div>
        <h3>${x(a.title)}</h3>
      </a>`;
  });
  html += '</div>';

  document.getElementById('content').innerHTML = html;
}

// ── States ─────────────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('content').innerHTML = `
    <div class="state-box">
      <div class="loading-spinner"></div>
      <div class="title" style="color:var(--gold);letter-spacing:.15em">טוען כתבות...</div>
    </div>`;
}

function showError(msg) {
  document.getElementById('content').innerHTML =
    `<div class="error-box">⚠ ${x(msg)}</div>`;
}

function x(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
